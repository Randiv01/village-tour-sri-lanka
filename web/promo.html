<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Village Tour Sri Lanka – Homestay Referral</title>
  <style>
    :root {
      --primary-dark: #2C221E;
      --secondary: #B86B35;
      --bg: #FBF9F6;
      --card: #FFFFFF;
      --border: #E6DFD5;
      --text-secondary: #6E655F;
      --green: #2E7D32;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--primary-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      max-width: 420px;
      width: 100%;
      padding: 28px 24px;
      box-shadow: 0 12px 32px rgba(44, 34, 30, 0.08);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #F4F0E8;
      color: var(--secondary);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    .icon-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(184, 107, 53, 0.12);
      color: var(--secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 30px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .location {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 600;
      margin-bottom: 16px;
    }
    .price-box {
      background: #FBF9F6;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 20px;
    }
    .price-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      font-weight: 700;
    }
    .price-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--secondary);
      margin-top: 4px;
    }
    .status {
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      background: rgba(46, 125, 50, 0.1);
      color: var(--green);
    }
    .btn {
      display: block;
      width: 100%;
      background: var(--primary-dark);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 15px 20px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.92;
    }
    .footer {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Village Tour Sri Lanka</div>
    <div class="icon-circle">🏡</div>
    <h1 id="homestayTitle">Authentic Village Homestay</h1>
    <div class="location" id="homestayLoc">📍 Sri Lanka</div>

    <div class="price-box">
      <div class="price-label">Special Referral Offer</div>
      <div class="price-value" id="homestayPrice">From Rs. 4,500 / night</div>
    </div>

    <div class="status" id="trackingStatus">
      ⏳ Verifying referral link click...
    </div>

    <a id="openAppBtn" class="btn" href="#">
      Open in Village Tour App
    </a>

    <div class="footer">
      Authentic rural homestays, living artisan crafts &amp; lake safaris
    </div>
  </div>

  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const sharerId = params.get("ref") || "";
      const homestayId = params.get("h") || "explore";
      const homestayTitle = params.get("title") || "Village Homestay";
      const homestayLoc = params.get("loc") || "Sri Lanka";
      const homestayPrice = params.get("price") || "4500";
      const platform = (params.get("p") || "other").toLowerCase();
      const campaignId = params.get("cmp") || "";

      document.getElementById("homestayTitle").textContent = homestayTitle;
      document.getElementById("homestayLoc").textContent = "📍 " + homestayLoc;
      const numericPrice = Number(homestayPrice) || 4500;
      document.getElementById("homestayPrice").textContent =
        "From Rs. " + numericPrice.toLocaleString() + " / night";

      const deepLink =
        "villagetour://homestay/" +
        encodeURIComponent(homestayId) +
        "?ref=" + encodeURIComponent(sharerId) +
        "&p=" + encodeURIComponent(platform) +
        "&cmp=" + encodeURIComponent(campaignId) +
        "&title=" + encodeURIComponent(homestayTitle) +
        "&loc=" + encodeURIComponent(homestayLoc) +
        "&tracked=1";

      const openAppBtn = document.getElementById("openAppBtn");
      openAppBtn.href = deepLink;

      const statusEl = document.getElementById("trackingStatus");

      if (!sharerId || sharerId === "guest") {
        statusEl.textContent = "✅ Welcome to Village Tour Sri Lanka!";
        return;
      }

      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      const dayKey = `${yyyy}-${mm}-${dd}`;
      const isoNow = now.toISOString();

      const projectUrl =
        "https://firestore.googleapis.com/v1/projects/village-tour-sri-lanka/databases/(default)/documents";

      try {
        const fields = {
          docType: { stringValue: "share_click" },
          sharerId: { stringValue: sharerId },
          homestayId: { stringValue: homestayId },
          homestayTitle: { stringValue: homestayTitle },
          homestayLocation: { stringValue: homestayLoc },
          platform: { stringValue: platform },
          clickedAt: { timestampValue: isoNow },
          dayKey: { stringValue: dayKey },
          rewardEarned: { doubleValue: 150.0 },
          referralTag: { stringValue: `${sharerId}_${homestayId}` },
        };
        if (campaignId) {
          fields.campaignId = { stringValue: campaignId };
        }

        const res = await fetch(`${projectUrl}/test_users`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fields }),
        });

        if (!res.ok) {
          throw new Error("Firestore HTTP " + res.status);
        }

        // If linked to a specific campaign, also increment its clicksCount
        if (campaignId) {
          try {
            const cmpRes = await fetch(
              `${projectUrl}/test_users/${encodeURIComponent(campaignId)}`
            );
            if (cmpRes.ok) {
              const cmpDoc = await cmpRes.json();
              const existingClicks =
                Number(
                  cmpDoc.fields?.clicksCount?.integerValue ??
                    cmpDoc.fields?.clicksCount?.doubleValue ??
                    0
                ) || 0;
              const nextClicks = existingClicks + 1;
              await fetch(
                `${projectUrl}/test_users/${encodeURIComponent(
                  campaignId
                )}?updateMask.fieldPaths=clicksCount&updateMask.fieldPaths=updatedAt`,
                {
                  method: "PATCH",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    fields: {
                      clicksCount: { integerValue: String(nextClicks) },
                      updatedAt: { timestampValue: isoNow },
                    },
                  }),
                }
              );
            }
          } catch (_) {}
        }

        statusEl.textContent =
          "✅ Referral link click verified! Opening Village Tour App...";

        setTimeout(() => {
          window.location.href = deepLink;
        }, 900);
      } catch (err) {
        statusEl.textContent =
          "🏡 Tap below to view this homestay in the Village Tour App";
      }
    })();
  </script>
</body>
</html>
