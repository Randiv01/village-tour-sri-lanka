name: village_tour_sri_lanka
description: "A mobile application for exploring Sri Lankan village tourism, homestays, and local experiences."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/app_icon.png"

  adaptive_icon_background: "#1F4D3A"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#FDFBF7"

  android: true
  ios: true
  web: false

  android_12:
    color: "#FDFBF7"

flutter:
  uses-material-design: true

  assets:
    - assets/images/