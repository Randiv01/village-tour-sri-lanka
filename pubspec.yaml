name: village_tour_sri_lanka
description: "A mobile application for exploring Sri Lankan village tourism, homestays, and local experiences."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloudinary_public: ^0.23.1
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  geolocator: ^14.1.1
  intl: ^0.20.3
  image_picker: ^1.2.3
  url_launcher: ^6.3.3
  intl_phone_field: ^3.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/app_icon.png"

  adaptive_icon_background: "#1F4D3A"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#FDFBF7"

  android: true
  ios: true
  web: false

  android_12:
    color: "#FDFBF7"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/sign-in/